[workspace]
resolver = "2"
members = ["crates/protocol", "crates/log", "crates/core", "crates/platform", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/kvmshare"

[workspace.dependencies]
kvmshare-protocol = { path = "crates/protocol" }
kvmshare-log = { path = "crates/log" }
kvmshare-core = { path = "crates/core" }
kvmshare-platform = { path = "crates/platform" }