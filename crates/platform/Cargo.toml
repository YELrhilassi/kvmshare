[package]
name = "kvmshare-platform"
description = "OS backends for kvmshare: input capture, cursor control, input injection, clipboard."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmshare-core = { workspace = true }
kvmshare-protocol = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xinput", "xfixes", "xtest"] }
arboard = "3.4"
[target.'cfg(windows)'.dependencies]
# Raw Input lives directly in `Win32_UI_Input` (no separate
# Win32_UI_Input_RawInput feature); the RI_MOUSE_*/RI_KEY_* constants
# live in Win32_UI_WindowsAndMessaging.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi", # WNDCLASSW / RegisterClassW are gated behind this
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
