[package]
name = "kvmshare-platform"
description = "OS backends for kvmshare: input capture, cursor control, input injection, clipboard."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmshare-core = { workspace = true }
kvmshare-protocol = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xinput", "xfixes", "xtest"] }
arboard = "3.4"