[package]
name = "kvmshare-core"
description = "Layout model, cursor/screen-switching session, and TCP server/client for kvmshare."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmshare-protocol = { workspace = true }
kvmshare-log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # SIO_KEEPALIVE_VALS via WSAIoctl — dead-peer detection on the control
  # link. WSAIoctl's signature references OVERLAPPED, which lives behind
  # Win32_System_IO, so that feature is required to import the function.
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }