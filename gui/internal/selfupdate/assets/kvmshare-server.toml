# kvmshare server configuration — the virtual desktop layout.
#
# The FIRST screen is always the server's own machine (this one).
# Every other screen is a client, matched by the name the client sends
# in its Hello (its hostname by default, or --name on the command line).
#
# Positions are in virtual desktop pixels relative to the server screen:
#   x < 0  → the client sits to the LEFT
#   x > 0  → the client sits to the RIGHT
#   y < 0  → above, y > 0 → below
# The cursor crosses between screens where their edges touch and overlap.

port = 24800

# The server's own screen (pc).
[[screens]]
name = "pc"
width = 1920
height = 1080
x = 0
y = 0

# A client to the left (hp). The client machine's hostname must be "hp",
# or it must be started with:  kvmshare-client <server> --name hp
[[screens]]
name = "hp"
width = 1920
height = 1080
x = -1920
y = 0

# A client above the server, half-overlapping:
# [[screens]]
# name = "mac"
# width = 2560
# height = 1440
# x = 640
# y = -1440